events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Die Ebenen-Dateien (outputs/ebenen/*.json, mehrere MB) und die App-HTML
    # komprimieren stark - spart beim Nachladen im Browser viel Zeit.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript text/plain image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /app/outputs;
        # Anders als beim alten FTP-Ziel (graswachstum.ch/uploads/, dort
        # bewusst die schlanke Vorschauseite mit Klick-zum-Nachladen) soll
        # diese dedizierte App-Domain direkt die volle interaktive Version
        # zeigen - kein Sinn, hier erst eine Vorschau zu laden.
        index Datenexplorer_app.html;

        location / {
            try_files $uri $uri/ =404;
            # Einbettung in graswachstum.ch (Grav-Plugin datenexplorer): die
            # Website holt Datenexplorer_einbettung.json und ebenen/*.json per
            # fetch() von hier - oeffentliche Daten, deshalb jede Herkunft.
            add_header Access-Control-Allow-Origin "*" always;
        }
    }
}
